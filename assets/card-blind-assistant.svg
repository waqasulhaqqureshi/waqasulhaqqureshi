<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="IoT Blind Assistant: on-device web app that describes objects, reads text and warns about obstacles for visually impaired users.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06222b"/><stop offset="1" stop-color="#1b4d6e"/></linearGradient>
    <clipPath id="c"><rect width="800" height="420" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="800" height="420" fill="url(#g)"/>
    <circle cx="730" cy="40" r="160" fill="#7fffd4" opacity="0.10"/>
    <text x="44" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#7fffd4">IOT PROJECT · LIVE WEB APP</text>
    <text x="44" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="800" fill="#fff">IoT Blind Assistant</text>
    <text x="44" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#d6f5ff">Describes objects, reads text, warns of obstacles</text>
    <g transform="translate(44 172)"><rect width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="31" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">IoT</text></g><g transform="translate(116 172)"><rect width="124" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="62" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">TensorFlow.js</text></g><g transform="translate(250 172)"><rect width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="33" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">OCR</text></g><g transform="translate(326 172)"><rect width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="42" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Speech</text></g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#d6f5ff">
      <text x="44" y="250">• Runs on the phone: no API key, no upload</text>
      <text x="44" y="278">• Left / ahead / right, text reading, BLE sensor</text>
      <text x="44" y="306">• 33 unit tests; tried on photos and a live loop</text>
      <text x="44" y="334">• Honest README: what is and is not verified</text>
    </g>
    <text x="44" y="388" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#7fffd4">github.com/waqasulhaqqureshi/iot-blind-assistant</text>
    <g transform="translate(520 40)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Camera frame</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">change check saves battery</text></g><path d="M635 98 v14 m-6 -6 l6 6 l6 -6" stroke="#7fffd4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 114)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">COCO-SSD + OCR</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">objects, positions, text</text></g><path d="M635 172 v14 m-6 -6 l6 6 l6 -6" stroke="#7fffd4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 188)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Announcer + sensor</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">cooldown, distance zones</text></g><path d="M635 246 v14 m-6 -6 l6 6 l6 -6" stroke="#7fffd4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 262)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Speech + vibration</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">short sentences</text></g>
    <circle r="5" fill="#7fffd4">
      <animateMotion dur="4s" repeatCount="indefinite" path="M505 69 L505 291"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
