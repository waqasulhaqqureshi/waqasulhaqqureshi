<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="IoT Blind Assistant: course prototype that narrates objects and text for visually impaired users. Camera, OpenCV, Cloud Vision, speech.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06222b"/><stop offset="1" stop-color="#1b4d6e"/></linearGradient>
    <clipPath id="c"><rect width="800" height="420" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="800" height="420" fill="url(#g)"/>
    <circle cx="730" cy="40" r="160" fill="#7fffd4" opacity="0.10"/>
    <text x="44" y="64" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#7fffd4">IOT COURSE PROTOTYPE</text>
    <text x="44" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="800" fill="#fff">IoT Blind Assistant</text>
    <text x="44" y="146" font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#d6f5ff">Narrates objects and text for visually impaired users</text>
    <g transform="translate(44 172)"><rect width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="31" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">IoT</text></g><g transform="translate(116 172)"><rect width="94" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="47" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">OpenCV</text></g><g transform="translate(220 172)"><rect width="124" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="62" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Cloud Vision</text></g><g transform="translate(354 172)"><rect width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="31" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">TTS</text></g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#d6f5ff">
      <text x="44" y="250">• Camera frames to spoken sentences</text>
      <text x="44" y="278">• Announcer: confidence filter, cooldown, no repeats</text>
      <text x="44" y="306">• 10 unit tests on the announcer logic</text>
      <text x="44" y="334">• Architecture notes, limits and next steps</text>
    </g>
    <text x="44" y="388" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#7fffd4">github.com/waqasulhaqqureshi/iot-blind-assistant</text>
    <g transform="translate(520 40)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Camera + OpenCV</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">capture, preprocess</text></g><path d="M635 98 v14 m-6 -6 l6 6 l6 -6" stroke="#7fffd4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 114)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Google Cloud Vision</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">objects and text</text></g><path d="M635 172 v14 m-6 -6 l6 6 l6 -6" stroke="#7fffd4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 188)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Phone app bridge</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">sensors, announcer</text></g><path d="M635 246 v14 m-6 -6 l6 6 l6 -6" stroke="#7fffd4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 262)"><rect width="230" height="58" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.4"/>
   <text x="18" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Text-to-Speech</text>
   <text x="18" y="45" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#bfeee0">short spoken sentences</text></g>
    <circle r="5" fill="#7fffd4">
      <animateMotion dur="4s" repeatCount="indefinite" path="M505 69 L505 291"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
