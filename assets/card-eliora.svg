<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Eliora AI: private AI assistant that runs on your phone. Flutter, GGUF models, offline.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0630"/><stop offset="1" stop-color="#5b1790"/></linearGradient>
    <clipPath id="c"><rect width="800" height="420" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="800" height="420" fill="url(#g)"/>
    <circle cx="700" cy="40" r="170" fill="#b43ad6" opacity="0.18"/>
    <circle cx="60" cy="400" r="130" fill="#7fffd4" opacity="0.07"/>
    <text x="44" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="800" fill="#fff">Eliora AI</text>
    <text x="44" y="126" font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#f3d9ff">Private AI that runs on your phone</text>
    <g transform="translate(44 156)"><rect width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="42" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Flutter</text></g><g transform="translate(138 156)"><rect width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="65" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">GGUF · Q4_K_M</text></g><g transform="translate(278 156)"><rect width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="40" y="19" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Offline</text></g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#e9d5ff">
      <text x="44" y="228">• Chat inference on the device, no server round-trip</text>
      <text x="44" y="256">• SmolLM2 · Qwen 2.5 · Gemma 2 · Mistral 7B</text>
      <text x="44" y="284">• Model catalog sized to the phone's RAM</text>
      <text x="44" y="312">• Final-year project, Ghazi University</text>
    </g>
    <text x="44" y="380" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#7fffd4">github.com/waqasulhaqqureshi/eliora-ai</text>
    <!-- phone -->
    <g transform="translate(520 40)">
      <rect width="230" height="340" rx="30" fill="#0e0320" stroke="#d9b3f5" stroke-width="3"/>
      <rect x="82" y="12" width="66" height="8" rx="4" fill="#3a2060"/>
      <rect x="22" y="52" width="170" height="44" rx="14" fill="#7e57c2"/>
      <text x="107" y="79" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#fff">Explain quantization simply</text>
      <rect x="38" y="112" width="178" height="112" rx="14" fill="#1f1236" stroke="#5e35b1"/>
      <g font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#e9d5ff">
        <text x="50" y="136">It stores a model's numbers</text>
        <text x="50" y="154">in fewer bits, so the model</text>
        <text x="50" y="172">fits in memory and runs on</text>
        <text x="50" y="190">a phone, with no internet.</text>
      </g>
      <g fill="#7fffd4">
        <circle cx="54" cy="208" r="3.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="68" cy="208" r="3.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="82" cy="208" r="3.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
      </g>
      <rect x="20" y="288" width="190" height="34" rx="17" fill="#1f1236" stroke="#5e35b1"/>
      <text x="38" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#a78bcc">Message Eliora…</text>
      <circle cx="190" cy="305" r="11" fill="#7fffd4"/>
      <g transform="translate(40 252)"><rect width="150" height="22" rx="11" fill="#7fffd4" fill-opacity="0.15"/><text x="75" y="15" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#7fffd4">Running on-device</text></g>
    </g>
  </g>
</svg>
